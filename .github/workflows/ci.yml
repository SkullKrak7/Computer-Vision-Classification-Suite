name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==26.1.0 ruff==0.14.14 mypy==1.19.1 isort==5.13.2
          pip install types-PyYAML types-Pillow

      - name: Check code formatting (black)
        run: black --check --diff --line-length 120 python/ backend/

      - name: Check import sorting (isort)
        run: isort --check-only --diff --profile black --line-length 120 python/ backend/

      - name: Lint with ruff
        run: ruff check python/ backend/

      - name: Type check with mypy
        run: mypy backend/app --ignore-missing-imports

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]==1.8.0

      - name: Run security scan
        run: bandit -r python/ backend/ -c pyproject.toml

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

  test-backend:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage

  test-cpp:
    name: C++ Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev wget
          # Install ONNX Runtime
          wget https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz
          tar -xzf onnxruntime-linux-x64-1.23.2.tgz
          sudo cp -r onnxruntime-linux-x64-1.23.2/include/* /usr/local/include/
          sudo cp -r onnxruntime-linux-x64-1.23.2/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Build C++ project
        run: |
          cd cpp
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run C++ tests
        run: |
          cd cpp/build
          ctest --output-on-failure

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Safety check disabled due to typer compatibility issues
      # Use pip-audit or snyk for dependency scanning instead

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest python/tests/ backend/tests/ -m integration -v || echo "No integration tests found yet"
        env:
          PYTHONPATH: ${{ github.workspace }}

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, security, test-backend, test-cpp, dependency-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test-backend.result }}" != "success" ]] || \
             [[ "${{ needs.test-cpp.result }}" != "success" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully"
